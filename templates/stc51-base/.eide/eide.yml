version: "4.1"
name: stc51-dev
type: C51
deviceName: null
packDir: null
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Application
      files:
        - path: source/main.c
      folders: []
    - name: Firmware
      # Only the libs the blank project actually references. Adding the rest
      # of the stc15_lib here pushes the firmware well past the STC15F104W
      # 4 KB flash limit and the link step fails with
      # "Insufficient ROM/EPROM/FLASH memory". Need USART / ADC / EEPROM /
      # Exti / PCA / GPIO? Add the corresponding .c here and your own code.
      files:
        - path: libraries/stc15_lib/source/delay.c
        - path: libraries/stc15_lib/source/soft_uart.c
        - path: libraries/stc15_lib/source/timer.c
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 31c064306d7d6ef41babf05495e50dc0
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
      incList:
        - libraries/stc15_lib/include
        - libraries/stc15_lib
      libList: []
    excludeList: []
    settings:
      debugger: unknown
    toolchain: SDCC
    toolchainConfigMap:
      SDCC:
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
          global:
            device: mcs51
            misc-controls: --iram-size 128 --xram-size 0 --code-size 4096 "-I__SDCC_ROOT__/share/sdcc/include" "-I__SDCC_ROOT__/share/sdcc/include/mcs51" "-L__SDCC_ROOT__/share/sdcc/lib/small"
            optimize-type: balanced
          linker:
            $mainFileName: main
            output-format: hex
    uploadConfigMap:
      stcgal:
        bin: ""
        eepromImgPath: "null"
        extraOptions: ""
        options: .eide/stc.flash.json
    uploader: stcgal
