version: "4.1"
name: stc89-dev
type: C51
deviceName: null
packDir: null
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Application
      files:
        - path: source/main.c
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 7c2f19a4b8e34d51a06c9e81f2b40d73
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
      incList: []
      libList: []
    excludeList: []
    settings:
      debugger: unknown
    toolchain: SDCC
    toolchainConfigMap:
      SDCC:
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c99
          global:
            device: mcs51
            # sdcc 自带 mcs51 头文件/库路径，不要加 -I/-L；尺寸参数按 STC89C51RC（4K ROM）
            misc-controls: --iram-size 128 --xram-size 0 --code-size 4096
            optimize-type: balanced
          linker:
            $mainFileName: main
            output-format: hex
    uploadConfigMap:
      stcgal:
        bin: ""
        eepromImgPath: "null"
        extraOptions: ""
        options: .eide/stc.flash.json
    uploader: stcgal
